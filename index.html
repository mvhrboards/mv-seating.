<!doctype html><html><head><meta charset="utf-8"><title>MV Seating Board</title><meta name="robots" content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MV Seating Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --surface-2:#F6F7F9; --line:#DDE0E5; --line-2:#C9CDD4;
  --ink:#1A202B; --ink-2:#465061; --muted:#767F8E; --ink-on:#FFFFFF;
  --sel:#E4572E;
  --occ:#2a78d6; --res:#eda100; --hot:#1baf7a; --grey:#8A909A;
  --occ-ink:#FFFFFF; --res-ink:#1A202B; --hot-ink:#0F1F18; --grey-ink:#FFFFFF;
  --bad:#C2413A; --bad-soft:#FBE8E6; --good:#1E7A3E;
  --shadow:0 1px 2px rgba(26,32,43,.06),0 8px 22px rgba(26,32,43,.06);
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --u:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111418; --surface:#1A1E24; --surface-2:#15191E; --line:#2A3039; --line-2:#38404B;
    --ink:#E8EBF0; --ink-2:#BCC3CE; --muted:#8B94A2; --ink-on:#111418;
    --sel:#FF7A50;
    --occ:#3987e5; --res:#c98500; --hot:#199e70; --grey:#6B717B;
    --occ-ink:#FFFFFF; --res-ink:#111418; --hot-ink:#06140E; --grey-ink:#FFFFFF;
    --bad:#EE8579; --bad-soft:#3A2321; --good:#6BC48A;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111418; --surface:#1A1E24; --surface-2:#15191E; --line:#2A3039; --line-2:#38404B;
  --ink:#E8EBF0; --ink-2:#BCC3CE; --muted:#8B94A2; --ink-on:#111418;
  --sel:#FF7A50;
  --occ:#3987e5; --res:#c98500; --hot:#199e70; --grey:#6B717B;
  --occ-ink:#FFFFFF; --res-ink:#111418; --hot-ink:#06140E; --grey-ink:#FFFFFF;
  --bad:#EE8579; --bad-soft:#3A2321; --good:#6BC48A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:18px 60px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px;border-radius:5px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.top h1{font-size:clamp(26px,3vw,34px);font-variation-settings:"wdth" 112;line-height:1.05}
.top .sub{color:var(--ink-2);margin-top:4px}
.save{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:none;background:transparent;border-radius:9px;padding:7px 13px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.tabs button.on{background:var(--ink);color:var(--ink-on)}
.tabs button .b{font-family:var(--mono);font-size:11px;font-weight:500;margin-left:5px;opacity:.75}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--display);font-size:25px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi small{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.kpi.bad b{color:var(--bad)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
input[type=text],input[type=search],input[type=date],select,textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:13.5px;max-width:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font-size:19px}
.panel h3{font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.notice{background:var(--surface);border:1px dashed var(--line-2);border-radius:10px;padding:12px 14px;color:var(--ink-2)}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}

/* floor tabs + map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:1180px){.mapgrid{grid-template-columns:1fr}}
.floors{display:flex;gap:4px;flex-wrap:wrap}
.bgroup{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap;padding-right:10px;margin-right:4px;border-right:1px solid var(--line)}
.bgroup:last-child{border-right:none}
.bgroup .eyebrow{margin-right:2px}
.bcmp tr.tot td{border-top:2px solid var(--line-2);font-weight:600}
.bcmp tr.cur td{background:var(--surface-2)}
.floors button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.floors button.on{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.floors button small{font-family:var(--mono);font-weight:400;font-size:11px;opacity:.8;margin-left:4px}
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px;max-height:78vh}
.map{display:grid;position:relative;width:max-content}
.zone{border:1.5px solid var(--line-2);border-radius:10px;background:var(--surface);pointer-events:none;position:relative}
.zone span{position:absolute;top:-10px;left:10px;background:var(--surface-2);padding:0 6px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lbl{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;pointer-events:none;line-height:1.1;font-style:italic}
.seat{border:1px solid transparent;border-radius:5px;margin:1.5px;padding:1px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-size:9.5px;line-height:1.05;text-align:center;position:relative;min-width:0;min-height:0}
.seat .dn{font-family:var(--mono);font-size:9px;font-weight:500;opacity:.9}
.seat .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seat.big .nm{white-space:normal;font-size:10.5px}
.seat.big .dn{font-size:10px}
.seat.occ{background:var(--occ);color:var(--occ-ink)}
.seat.res{background:var(--res);color:var(--res-ink)}
.seat.res::after{content:"R";position:absolute;top:1px;right:2px;font-size:8px;font-weight:700}
.seat.hot{background:var(--hot);color:var(--hot-ink)}
.seat.vac{background:var(--surface);border:1.5px dashed var(--ink-2);color:var(--ink-2)}
.seat.pub{background:repeating-linear-gradient(135deg,var(--surface-2) 0 4px,var(--line) 4px 5px);border-color:var(--line-2);color:var(--ink-2)}
.seat.lock{background:repeating-linear-gradient(45deg,var(--grey) 0 5px,color-mix(in srgb,var(--grey) 75%,#000) 5px 6px);color:var(--grey-ink)}
.seat.uns{background:var(--surface);border:1.5px dotted var(--muted);color:var(--muted)}
.seat.dim{opacity:.18}
.seat.hit{box-shadow:0 0 0 2.5px var(--sel);z-index:2}
.seat.selected{box-shadow:0 0 0 3px var(--sel),0 0 0 6px color-mix(in srgb,var(--sel) 25%,transparent);z-index:3}
.seat.drop{box-shadow:0 0 0 3px var(--ink);z-index:3}
.seat.new{outline:2px solid var(--sel);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.sw.occ{background:var(--occ)} .sw.res{background:var(--res)} .sw.hot{background:var(--hot)}
.sw.vac{border:1.5px dashed var(--ink-2)} .sw.pub{background:repeating-linear-gradient(135deg,var(--surface-2) 0 3px,var(--line-2) 3px 4px);border:1px solid var(--line-2)}
.sw.lock{background:repeating-linear-gradient(45deg,var(--grey) 0 3px,color-mix(in srgb,var(--grey) 75%,#000) 3px 4px)} .sw.uns{border:1.5px dotted var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:transparent;padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--ink-on)}
.dlg{border:1px solid transparent;background:transparent;border-radius:999px;padding:2px 8px 2px 4px;display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--ink-2)}
.dlg:hover,.dlg[aria-pressed="true"]{border-color:var(--line-2);background:var(--surface)}
.seat.res-mark::after{content:"R";position:absolute;top:1px;right:2px;font-size:8px;font-weight:700}
.dcols{display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto}
.dcol{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:2px 0;cursor:pointer}
.xlinfo{font-size:12px;color:var(--ink-2);margin-right:4px}
.rp-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.rp-it{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-weight:400;color:var(--ink);cursor:pointer}
.rp-it b{display:block;font-size:13px}.rp-it small{display:block;color:var(--muted);font-size:11.5px}
.field .rp-it input[type=checkbox]{margin-top:3px;width:16px;height:16px;min-width:16px;flex:0 0 16px}.rp-it>span{flex:1;min-width:0;text-align:left;display:block}
@media (max-width:560px){.rp-list{grid-template-columns:1fr}}
.dcol.del{grid-template-columns:28px 1fr auto auto}
.dcol input[type=color]{width:26px;height:22px;border:1px solid var(--line-2);border-radius:5px;padding:0;background:none;cursor:pointer}
.zoom{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.zoom button{border:none;background:var(--surface);width:32px;height:30px;font-weight:700}
.zoom button+button{border-left:1px solid var(--line-2)}
.side{display:flex;flex-direction:column;gap:12px}
.ztable{width:100%;border-collapse:collapse;font-size:12.5px}
.ztable th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 4px;font-weight:600;border-bottom:1px solid var(--line)}
.ztable td{padding:5px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ztable td.n{font-family:var(--mono);text-align:right}
.ztable th.n{text-align:right}
.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:380px;overflow:auto}
.req{border:1px solid var(--line);border-left:3px solid var(--res);border-radius:8px;padding:7px 9px;background:var(--surface);cursor:grab;font-size:12.5px}
.req b{display:block;font-weight:600;font-size:13px}
.req span{color:var(--muted)}

/* table */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:70vh}
table.t{border-collapse:collapse;width:100%;min-width:900px}
.t th{position:sticky;top:0;background:var(--surface);z-index:1;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;cursor:pointer;white-space:nowrap}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .sw{width:10px;height:10px;border-radius:3px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;font-size:12px}
.chip button{border:none;background:transparent;padding:0 2px;color:var(--muted)}
.link{border:none;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:2px;padding:0;font-weight:600}

/* analysis */
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:950px){.agrid{grid-template-columns:1fr}}
.agrid .wide{grid-column:1/-1}
.cap{font-size:12px;color:var(--muted);margin-top:-8px}
.heat{border-collapse:separate;border-spacing:3px;width:100%}
.heat th{font-size:11px;color:var(--muted);font-weight:600;text-align:left;padding:4px}
.heat td{border-radius:6px;padding:8px;font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.heat td b{display:block;font-family:var(--display);font-size:16px}
.stack{display:grid;grid-template-columns:170px 1fr 46px;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.stack .bar{display:flex;gap:2px;height:16px}
.stack .bar i{display:block;height:100%;border-radius:3px;min-width:2px}
.stack .bar i.vac{border:1.5px dashed var(--ink-2)}
.stack .v{font-family:var(--mono);font-size:12px;text-align:right}
.hbars{display:flex;flex-direction:column;gap:5px}
.hbar{display:grid;grid-template-columns:minmax(120px,250px) 1fr 40px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2);padding:1px 0;border-radius:5px}
.hbar:hover{background:var(--surface-2)}
.hbar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{height:13px;position:relative}
.hbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--occ);border-radius:0 4px 4px 0;min-width:2px}
.hbar .v{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink)}
.dq{display:flex;flex-direction:column}
.dq .it{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dq .it:last-child{border-bottom:none}
.dq .it b{font-family:var(--mono);font-weight:500}
.dq .it.bad b{color:var(--bad)}
.dq .sub{font-size:12px;color:var(--muted)}
.callout{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13.5px}
.callout b{font-family:var(--display)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.35);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(470px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line)}
.drawer>*{flex-shrink:0}
.drawer h3{font-size:22px;font-variation-settings:"wdth" 110}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
@media (max-width:460px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{font-size:14px;font-weight:400;color:var(--ink);width:100%}
.hint{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dirs{display:grid;grid-template-columns:repeat(3,auto);gap:4px;justify-content:start}
.dirs button{width:44px;height:32px}
.box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.offbar{background:color-mix(in srgb,var(--res) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--res) 45%,transparent);border-radius:10px;padding:9px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:13px}
.field .dsw-in,.dsw-in{width:34px!important;flex:none!important;height:30px;border:1px solid var(--line-2);border-radius:7px;padding:0 2px;background:var(--surface);cursor:pointer;flex:none}
.dsw-in:disabled{opacity:.4;cursor:not-allowed}
.tcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.tcards{grid-template-columns:1fr}}
.tcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.tcard b{font-family:var(--display);font-size:24px;line-height:1.1}
.tcard small{font-size:12px;color:var(--ink-2)}
.tcard .meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden;display:block}
.tcard .meter i{display:block;height:100%;background:var(--occ)}
.tmx th{white-space:nowrap}
.crt{min-width:1500px}
.crt td{padding:4px 5px}
.crt input,.crt select{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;font-size:12.5px}
.crt input:hover,.crt select:hover{border-color:var(--line-2)}
.crt input:focus,.crt select:focus{border-color:var(--occ);background:var(--surface);outline:none}
.crt tbody tr{cursor:default}
.tmx tr.tot td{border-top:2px solid var(--line-2)}
.stlist{display:flex;flex-direction:column;gap:4px}
.strow{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}
.strow.cus-r{grid-template-columns:34px minmax(0,1fr) minmax(0,1.3fr) auto auto}
.strow.hb-r{grid-template-columns:minmax(0,1fr) auto auto}
.strow.hb-x{grid-template-columns:minmax(0,1fr) auto minmax(0,150px) auto}
@media (max-width:560px){.strow.hb-x{grid-template-columns:1fr 1fr}.strow.hb-x>span{grid-column:1/-1}}
.strow input[type=color],#stNewC{width:30px;height:26px;border:1px solid var(--line-2);border-radius:6px;padding:0;background:none;cursor:pointer}
.strow input[type=text]{min-width:0}
.strow select{min-width:0;font-size:12.5px}
@media (max-width:560px){.strow.cus-r{grid-template-columns:34px 1fr auto}.strow.cus-r select{grid-column:1/-1}}
.howto{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--occ);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.howto-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.howto h2{font-size:17px}
.howto ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:h}
@media (max-width:900px){.howto ol{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.howto ol{grid-template-columns:1fr}}

function swapZones(fl,z1,z2,doNames,doPos){
  const ss=seatsOf(fl), lab=floors[fl].labels||(floors[fl].labels=[]);

    const horiz=A.c1<=B.c0||B.c1<=A.c0; const k0=horiz?"c0":"r0", k1=horiz?"c1":"r1", pk=horiz?"c":"r", sk=horiz?"w":"h";

    if(L[k1]>R[k0]) return "These zones overlap on the map, so their positions cannot be swapped.";

    if(!db) return;
    setSave("Saving…");
    const body=JSON.parse(JSON.stringify(bodyFor(k)));
    try{ await db.doc(k).set(body); lastJSON[k]=JSON.stringify(body); dirty.delete(k); if(!dirty.size) setSave("All changes saved"); }
    catch(e){ if(e&&e.code==="conflict"){ dirty.delete(k); lastJSON[k]=null; setSave("Updated by someone else"); toast("Someone else changed this at the same moment. The board now shows the latest version, so please redo your last change."); if(window.__sharedRefresh) window.__sharedRefresh(k); return; }

      if(e&&e.code==="unavailable"){ setSave("Retrying…"); setTimeout(()=>write(k),1500); } else { setSave("Not saved"); toast(e&&e.code==="invalid_argument"?"You have view access only, so changes are not saved.":"Could not save. Try again in a moment."); } }

  const before=snapshotState();

  plan.reqs.forEach(r=>{ if(r.seatUid===src.uid&&src.reqUid!==r.id) r.seatUid=dst.reqUid===r.id?dst.uid:r.seatUid; });
  markFloor(src.floor); markFloor(dst.floor); mark("plan/main");

function addSeatNext(ref,dir,type){
  const fl=ref.floor; type=type||(ref.type==="Meeting Room"?"Desk":ref.type);

function refreshMapMarks(){
  const q=mf.q.trim().toLowerCase();
  document.querySelectorAll("#map .seat").forEach(el=>{const s=findSeat(el.dataset.seat); if(!s) return;
    const hit=q&&((s.name||"")+" "+s.id+" "+(s.title||"")+" "+(s.dept||"")).toLowerCase().includes(q);
    el.classList.toggle("hit",!!hit); el.classList.toggle("dim",!matchesMap(s)||(!!q&&!hit));});
  if(q){const f=document.querySelector("#map .seat.hit"); if(f) f.scrollIntoView({block:"nearest",inline:"nearest"});
    else { const other=allSeats().find(s=>((s.name||"")+" "+s.id).toLowerCase().includes(q)); if(other&&other.floor!==floor){ toastJump(other); } } }
}

async function importPdf(file){

  let who="", comments=""; const seatCh=new Map(), reqCh=new Map();

  fields.forEach(fd=>{ const n=fd.getName(); const p=n.split("|"); const v=val(fd);

  });

  const rows=[]; seatCh.forEach((d,st)=>Object.entries(d).forEach(([k,v])=>rows.push([st.id,label[k],st[k]||"",v])));

    ${comments?`<div class="hint" style="display:block"><b>Comments:</b> ${esc(comments)}</div>`:""}
    <div class="tbl-wrap" style="max-height:46vh"><table class="t" style="min-width:480px"><thead><tr><th>Seat / position</th><th>Field</th><th>Board now</th><th>In their PDF</th></tr></thead><tbody>${rows.slice(0,400).map(r=>`<tr style="cursor:default"><td class="mono">${esc(r[0])}</td><td>${esc(r[1])}</td><td style="color:var(--muted)">${esc(r[2]||"–")}</td><td><b style="font-weight:600">${esc(r[3]||"–")}</b></td></tr>`).join("")||'<tr><td colspan="4" class="empty">Nothing is different from the board.</td></tr>'}</tbody></table></div>
    <div class="cap" style="margin:0">If the board changed after the form was sent, their older values also show here. Applying updates every listed change; you can Undo straight after or fix individual seats.</div>
    <div class="row"><span class="spacer"></span><button class="btn" id="ipX">Cancel</button><button class="btn primary" id="ipOk" ${rows.length?"":"disabled"}>Apply ${rows.length} change${rows.length===1?"":"s"}</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#ipX").onclick=()=>m.remove();
  m.querySelector("#ipOk").onclick=()=>{ const before=snapshotState(); const fls=new Set();
    seatCh.forEach((d,st)=>{ if(d.status==="Vacant"){ if(st.reqUid){const r=reqOf(st.reqUid); if(r) r.seatUid="";} clearPerson(st); } Object.assign(st,d); if(d.name&&isFree(st)&&!d.status) st.status="Occupied"; fls.add(st.floor); });
    reqCh.forEach((d,r)=>{ Object.assign(r,d); const st=r.seatUid?findSeat(r.seatUid):null; if(st&&st.status==="Reserved"&&d.candidate!=null){ st.name=d.candidate; fls.add(st.floor);} });
    fls.forEach(markFloor); if(reqCh.size) mark("plan/main"); assignMissingColors();
    log("PDF update",`${rows.length} changes from ${who||file.name}`); m.remove(); render(); toast(`${rows.length} changes applied from ${who||"the PDF"}`,()=>restoreState(before)); };
}

/* ---- Linked Excel file (offline board + OneDrive sync) ---- */
function kvDb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("mvsb",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
async function kvGet(k){ try{ const d=await kvDb(); return await new Promise(res=>{ const q=d.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function kvSet(k,v){ try{ const d=await kvDb(); await new Promise(res=>{ const t=d.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
const canLinkXl=()=>typeof window.showOpenFilePicker==="function";
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
async function unlinkExcel(btn){
  const nm=lsGet("mvsb-xl-name")||"the Excel file";
  if(btn&&!btn.dataset.sure){ btn.dataset.sure="1"; btn.textContent="Click again to unlink"; setTimeout(()=>{ if(btn.isConnected&&btn.dataset.sure){ delete btn.dataset.sure; btn.textContent="Unlink"; } },5000); return; }
  await kvSet("xlDir",null); await kvSet("xlHandle",null);
  ["mvsb-xl-name","mvsb-xl-folder","mvsb-xl-refreshed","mvsb-xl-snap"].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  xlStatus(); toast(`Unlinked ${nm}. Your seating data on the board is kept. Link a file again any time.`);
}
function markXlRefreshed(file){ lsSet("mvsb-xl-refreshed",JSON.stringify({name:file.name,mod:file.lastModified,at:Date.now()})); xlStatus(); }
function xlStatus(){ const el=document.querySelector("#xlInfo"); if(!el) return; const nm=lsGet("mvsb-xl-name"); let r=null; try{ r=JSON.parse(lsGet("mvsb-xl-refreshed")||"null"); }catch(e){}
  el.textContent=nm?`Linked to ${lsGet("mvsb-xl-folder")?lsGet("mvsb-xl-folder")+" / ":""}${nm}`+(r&&r.name===nm?` · refreshed ${new Date(r.at).toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}`:" · not refreshed yet"):"No Excel file linked yet";
  const rb=document.querySelector("#xlRefresh"); if(rb) rb.textContent=nm?"Refresh from Excel":"Link Excel file"; const cb=document.querySelector("#xlChange"); if(cb) cb.hidden=!nm; const ub=document.querySelector("#xlUnlink"); if(ub){ ub.hidden=!nm; ub.textContent="Unlink"; delete ub.dataset.sure; } }
const xlEmbedded=()=>{ try{ return window.top!==window.self; }catch(e){ return true; } };
function xlFallbackMsg(why){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="Excel link"><h3 style="font-size:17px">Load the Excel file another way</h3>
    <div class="cap" style="margin:0">${esc(why)}</div>
    <div class="callout" style="font-size:13px">Click <b>Choose Excel file</b> below and pick the Excel file from your MV Seating folder. The changes are shown for you to approve, exactly like a refresh. This works in any browser; you just pick the file each time.</div>
    <div class="row"><span class="spacer"></span><button class="btn" id="xfX">Close</button><label class="btn primary" for="xlPick" id="xfGo" style="cursor:pointer">Choose Excel file</label></div></div>`;
  document.body.appendChild(m); m.querySelector("#xfX").onclick=()=>m.remove(); m.querySelector("#xfGo").addEventListener("click",()=>setTimeout(()=>m.remove(),300));
}
async function linkExcel(){
  if(!canLinkXl()||typeof window.showDirectoryPicker!=="function"){ xlFallbackMsg("This browser cannot keep a link to a folder on your computer. Edge or Chrome can."); return; }
  if(xlEmbedded()){ xlFallbackMsg("The board is open inside another page (for example a OneDrive or SharePoint preview), which is not allowed to link files. Open the board by double-clicking it in File Explorer to keep a permanent link."); return; }
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="Link Excel"><h3 style="font-size:17px">Link the board to your Excel file</h3>
    <div class="cap" style="margin:0">Step 1: choose the <b>MV Seating</b> folder in your OneDrive (the folder that holds the Excel file). The board then reads the Excel file from that folder every time you click Refresh, even after OneDrive updates the file.</div>
    <div class="row"><span class="spacer"></span><button class="btn" id="lkX">Cancel</button><button class="btn primary" id="lkGo">Choose the folder</button></div></div>`;
  document.body.appendChild(m); m.querySelector("#lkX").onclick=()=>m.remove();
  m.querySelector("#lkGo").onclick=async()=>{
    let dir; try{ dir=await window.showDirectoryPicker({id:"mvseating",mode:"read"}); }
    catch(e){ if(e&&e.name==="AbortError") return; console.error(e); m.remove(); xlFallbackMsg("The browser did not allow the link ("+((e&&(e.name+": "+e.message))||"unknown reason")+")."); return; }
    const files=[]; try{ for await (const [n,h] of dir.entries()){ if(h.kind==="file"&&/\.xlsx$|\.xlsm$/i.test(n)&&!/^~\$/.test(n)) files.push(n); } }catch(e){ console.error(e); }
    if(!files.length){ m.querySelector(".cap").innerHTML=`No Excel file was found in <b>${esc(dir.name)}</b>. Choose the folder that contains the seating Excel file.`; return; }
    files.sort((a,b)=>(/seating/i.test(b)?1:0)-(/seating/i.test(a)?1:0)||a.localeCompare(b));
    const done=async name=>{ await kvSet("xlDir",dir); await kvSet("xlHandle",null); lsSet("mvsb-xl-name",name); lsSet("mvsb-xl-folder",dir.name); m.remove(); xlStatus(); toast(`Linked to ${name}. Click Refresh from Excel any time.`); await refreshFromExcel(); };
    if(files.length===1) return done(files[0]);
    m.querySelector(".card").innerHTML=`<h3 style="font-size:17px">Step 2: which Excel file?</h3><div class="cap" style="margin:0">Folder: <b>${esc(dir.name)}</b></div>
      <div class="stlist">${files.map(n=>`<label class="strow" style="grid-template-columns:20px 1fr;cursor:pointer"><input type="radio" name="lkf" value="${esc(n)}" ${n===files[0]?"checked":""}><span>${esc(n)}</span></label>`).join("")}</div>
      <div class="row"><span class="spacer"></span><button class="btn" id="lkX2">Cancel</button><button class="btn primary" id="lkOk">Link this file</button></div>`;
    m.querySelector("#lkX2").onclick=()=>m.remove();
    m.querySelector("#lkOk").onclick=()=>done(m.querySelector('input[name=lkf]:checked').value);
  };
}
async function xlReadLinked(){
  const name=lsGet("mvsb-xl-name"); const dir=await kvGet("xlDir");
  if(dir){
    let p=await dir.queryPermission({mode:"read"}); if(p!=="granted") p=await dir.requestPermission({mode:"read"});
    if(p!=="granted"){ const e=new Error("permission"); e.name="PermissionDenied"; throw e; }
    const fh=await dir.getFileHandle(name); return await fh.getFile();
  }
  const h=await kvGet("xlHandle"); if(!h){ const e=new Error("nolink"); e.name="NoLink"; throw e; }
  let p=await h.queryPermission({mode:"read"}); if(p!=="granted") p=await h.requestPermission({mode:"read"});
  if(p!=="granted"){ const e=new Error("permission"); e.name="PermissionDenied"; throw e; }
  return await h.getFile();
}
async function refreshFromExcel(){
  if(!canLinkXl()||xlEmbedded()||!lsGet("mvsb-xl-name")){ return linkExcel(); }
  const name=lsGet("mvsb-xl-name");
  let f=null, err=null;
  for(let attempt=0;attempt<3&&!f;attempt++){
    try{ f=await xlReadLinked(); }
    catch(e){ err=e; if(e.name==="PermissionDenied"||e.name==="NoLink"||e.name==="NotFoundError") break; await new Promise(r=>setTimeout(r,1500)); }
  }
  if(f){ await importExcel(f,{linked:true}); return; }
  console.error(err);
  const n=err&&err.name;
  if(n==="NoLink") return linkExcel();
  if(n==="PermissionDenied") return toast("Click Refresh from Excel again and choose Allow (or “Allow on every visit”) so the board can read the Excel file. The link is kept.");
  if(n==="NotFoundError") return toast(`${name} is no longer in the linked folder. If it was renamed, use “Change file” to pick it again.`);
  if(n==="NotReadableError"||n==="InvalidStateError") return toast(`${name} is busy right now (OneDrive is syncing it, or it is open in the Excel app). Wait a minute and click Refresh again. The link is kept.`);
  toast(`Could not read ${name} (${n||"unknown"}). The link is kept; try Refresh again in a minute.`);
}

function hbars(rows,onclick,colorFn){

  const max=Math.max(...rows.map(r=>r.v),1);
  return `<div class="hbars">${rows.map(r=>`<div class="hbar" data-tip="${esc(r.tip||r.l+": "+r.v)}" ${onclick?`data-act="${esc(onclick(r))}" style="cursor:pointer"`:""}><span class="lb" title="${esc(r.l)}">${esc(r.l)}</span><span class="tr"><i style="width:${Math.max(r.v/max*100,1)}%;${colorFn&&colorFn(r)?"background:"+colorFn(r):""}"></i></span><span class="v">${r.v}</span></div>`).join("")}</div>`;
}
function rAnalysis(){

  const fcards=FL.map(f=>{const xs=seatsOf(f); const t=stats(xs); const ws=xs.filter(s=>s.type!=="Meeting Room"); const n=ws.length||1;

    const seg=[["var(--occ)",ws.filter(s=>s.status==="Occupied").length],["var(--res)",ws.filter(s=>s.status==="Reserved").length],["var(--hot)",ws.filter(s=>s.status==="Hot Desk").length],["var(--line-2)",ws.filter(s=>s.status==="Vacant").length]];

  const typeCards=tTypes.map(t=>{const xs=all.filter(x=>x.type===t); const x=stats(xs); const use=xs.filter(y=>y.status==="Occupied"||y.status==="Reserved"||y.status==="Hot Desk"||(cusOf(y.status)&&cusOf(y.status).kind==="inuse")).length;
    return `<div class="tcard"><span class="eyebrow">${esc(t)}</span><b>${xs.length}</b><small>${use} in use · ${xs.filter(isFree).length} available · ${xs.filter(y=>["Public","Locked","Under Maintenance"].includes(y.status)||(cusOf(y.status)&&cusOf(y.status).kind==="off")).length} not bookable</small><span class="meter"><i style="width:${xs.length?Math.round(use/xs.length*100):0}%"></i></span><small>${xs.length?Math.round(use/xs.length*100):0}% in use</small></div>`}).join("");
  const typeMatrix=`<div class="tcards">${typeCards}</div><div style="overflow-x:auto"><table class="ztable tmx" style="min-width:${200+tSt.length*90}px"><thead><tr><th>Seat type</th>${tSt.map(st=>`<th class="n"><span style="display:inline-flex;gap:5px;align-items:center;justify-content:flex-end">${swOf(st)}${esc(st)}</span></th>`).join("")}<th class="n">Total</th></tr></thead><tbody>

    <tr class="tot"><td><b>Total</b></td>${tSt.map(st=>`<td class="n"><b>${all.filter(x=>x.status===st).length}</b></td>`).join("")}<td class="n"><b>${all.length}</b></td></tr></tbody></table></div>`;
  $("#main").innerHTML=`<div class="agrid">
    <section class="panel wide"><div class="row"><h3>Buildings</h3><span class="spacer"></span><button class="btn small primary" data-rpt="1">Download presentation</button><span class="seg" role="group" aria-label="Building">${[["","Both buildings"],["DMG Building","DMG Building"],["State Plaza","State Plaza"]].map(([v,l])=>`<button data-bld="${esc(v)}" class="${dashB===v?"on":""}">${l}</button>`).join("")}</span></div>

      ${[...BUILDINGS.map(b=>[b,FLOOR_ORDER.filter(f=>floors[f]&&BLD[f]===b)]),["Total",FLOOR_ORDER.filter(f=>floors[f])]].map(([b,fs])=>{const x=stats(fs.flatMap(seatsOf)); return `<tr class="${b==="Total"?"tot":""} ${dashB===b?"cur":""}"><td>${b==="Total"?"<b>Total</b>":esc(b)}</td><td class="n">${fs.length}</td><td class="n">${x.work}</td><td class="n">${x.rooms}</td><td class="n">${x.occ}</td><td class="n">${x.res}</td><td class="n">${x.hot}</td><td class="n">${x.vac}</td><td class="n">${x.uns}</td><td class="n"><b>${x.pct}%</b></td></tr>`}).join("")}</tbody></table></div></section>
    <section class="panel wide"><h3>Floors at a glance${dashB?" · "+esc(dashB):""}</h3><div class="cap">Click a floor to open its map</div><div class="fcards">${fcards}</div></section>
    <section class="panel wide"><div class="callout">${needSeat?`<b>${needSeat}</b> open position${needSeat===1?"":"s"} still need${needSeat===1?"s":""} a seat and there ${vacTotal===1?"is":"are"} <b>${vacTotal}</b> vacant workstation${vacTotal===1?"":"s"} ${dashB?"in "+esc(dashB):"across both buildings"}. ${gap>=0?`That leaves ${gap} spare after booking every open position.`:`You are short by ${-gap} seat${gap===-1?"":"s"}.`}`:`Every open position has a seat. <b>${vacTotal}</b> workstations are still vacant.`}</div></section>
    <section class="panel"><h3>Occupancy by floor and zone</h3><div class="cap">Occupied and reserved, as a share of bookable seats</div>
      <div style="overflow-x:auto"><table class="heat"><thead><tr><th></th>${zonesAll.map(z=>`<th>Zone ${z}</th>`).join("")}<th>Floor</th></tr></thead><tbody>${heatRows}</tbody></table></div></section>

    <section class="panel wide"><h3>Data quality</h3><div class="cap">Click a count to open those seats in the registry</div>

      ${D.variants.map(g=>{const names=Object.entries(g).sort((a,b)=>b[1]-a[1]); return `<div class="it bad"><span>HRBP spelled ${names.length} ways: ${names.map(([n,c])=>`${esc(n)} (${c})`).join(", ")}</span><button class="btn small" data-std="${esc(names[0][0])}" data-from="${esc(JSON.stringify(names.map(x=>x[0])))}">Use “${esc(names[0][0])}”</button></div>`}).join("")}
      ${plan.reqs.filter(r=>r.preassigned==="Yes"&&!r.seatUid).length?`<div class="it bad"><span>Positions marked pre-assigned in Excel with no seat recorded</span><b>${plan.reqs.filter(r=>r.preassigned==="Yes"&&!r.seatUid).length}</b></div>`:""}
      </div></section>
  </div>`;
}

/* ---- Change requests ---- */
function rChanges(){
  const CR_ST=["Pending","Approved","Rejected","Done"];
  $("#main").innerHTML=`<div class="agrid">
    <section class="panel wide"><div class="row"><h2>Seating change requests</h2><span class="spacer"></span><button class="btn primary" id="addCr">New request</button></div>
      <div class="tbl-wrap"><table class="t crt"><thead><tr><th>ID</th><th>Date submitted</th><th>Employee</th><th>Department</th><th>Current seat</th><th>Requested seat</th><th>Reason</th><th>Priority</th><th>HRBP</th><th>Approval date</th><th>Status</th><th>Notes</th><th></th></tr></thead>
      <tbody>${changes.requests.map((c,i)=>{ const ti=(k,w,extra)=>`<input type="text" data-cr="${i}" data-k="${k}" value="${esc(c[k]||"")}" style="width:${w}" ${extra||""} aria-label="${k}">`; const di=k=>`<input type="date" data-cr="${i}" data-k="${k}" value="${esc(/^\d{4}-\d{2}-\d{2}$/.test(c[k]||"")?c[k]:"")}" aria-label="${k}">`;
        return `<tr><td>${ti("id","72px",'class="mono"')}</td><td>${di("date")}</td><td>${ti("name","150px",'list="names"')}</td>
        <td><select data-cr="${i}" data-k="dept" aria-label="Department" style="width:170px">${deptOptions(c.dept||"").replace('<option value="__new__">+ Add a new department…</option>','')}</select></td>
        <td>${ti("cur","90px",'class="mono"')}</td><td>${ti("req","90px",'class="mono"')}</td><td>${ti("reason","210px")}</td>
        <td><select data-cr="${i}" data-k="prio" aria-label="Priority">${["High","Medium","Low"].map(x=>`<option ${(c.prio||"Medium")===x?"selected":""}>${x}</option>`).join("")}</select></td>
        <td>${ti("hrbp","130px",'list="hrbps"')}</td><td>${di("approved")}</td>
        <td><select data-cr="${i}" data-k="status" aria-label="Status">${CR_ST.map(x=>`<option ${(c.status||"Pending")===x?"selected":""}>${x}</option>`).join("")}</select></td>
        <td>${ti("notes","160px")}</td><td><button class="x" data-crdel="${i}" title="Delete this request" aria-label="Delete request">✕</button></td></tr>`}).join("")||'<tr><td colspan="13" class="empty">No change requests.</td></tr>'}</tbody></table></div>
      <div class="cap" style="margin-top:0">When a request is approved, open the employee's seat on the map and drag them to the new seat. The move is recorded in the activity log.</div>
    </section>
    <section class="panel wide"><h3>Activity log</h3><div class="cap">Every change made on this board, newest first</div>
      <div class="tbl-wrap" style="max-height:420px"><table class="t" style="min-width:600px"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead><tbody>${changes.log.map(l=>`<tr style="cursor:default"><td class="mono" style="white-space:nowrap">${esc(new Date(l.at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}</td><td>${esc(l.by||"")}</td><td>${esc(l.action)}</td><td>${esc(l.detail)}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No changes yet.</td></tr>'}</tbody></table></div>
    </section></div>`;
  document.querySelectorAll("[data-cr]").forEach(el=>el.addEventListener(el.tagName==="SELECT"||el.type==="date"?"change":"input",e=>{const c=changes.requests[+el.dataset.cr]; c[el.dataset.k]=e.target.value; if(el.dataset.k==="status"&&e.target.value==="Approved"&&!c.approved){ c.approved=today(); const ad=el.closest("tr").querySelector('[data-k="approved"]'); if(ad) ad.value=c.approved; } mark("changes/main"); if(el.tagName==="SELECT") renderTabs();}));
  document.querySelectorAll("[data-crdel]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.crdel, c=changes.requests[i];
    if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Delete?"; b.style.color="var(--bad)"; b.style.fontWeight="600"; setTimeout(()=>{ if(b.isConnected){ b.dataset.sure=""; b.textContent="✕"; b.style.color=""; b.style.fontWeight=""; } },3000); return; }
    const before=snapshotState(); changes.requests.splice(i,1); log("Change request deleted",`${c.id||"Request"}${c.name?" ("+c.name+")":""} deleted`); mark("changes/main"); rChanges(); renderTabs(); toast(`${c.id||"Request"} deleted`,()=>restoreState(before)); });
  $("#addCr").onclick=()=>{const n=Math.max(0,...changes.requests.map(c=>parseInt(String(c.id).replace(/\D/g,""),10)||0))+1; changes.requests.push({id:"CR-"+String(n).padStart(3,"0"),date:today(),name:"",dept:"",cur:"",req:"",reason:"",prio:"Medium",hrbp:"Israa ElSisi",approved:"",status:"Pending",notes:""}); mark("changes/main"); rChanges();};
}

/* ---------- global events ---------- */
document.addEventListener("click",e=>{
  if(e.target.closest("#layer")||e.target.closest(".modal")) return;
  const v=e.target.closest("[data-view]"); if(v){view=v.dataset.view; sel=null; render(); return;}
  const f=e.target.closest("[data-floor]"); if(f){floor=f.dataset.floor; sel=null; newUid=null; render(); return;}
  const st=e.target.closest("[data-seat]"); if(st){openSeat(st.dataset.seat); return;}
  const op=e.target.closest("[data-open]"); if(op){openSeat(op.dataset.open); return;}
  const lfb=e.target.closest("[data-left]"); if(lfb){ leaverToHiring(findSeat(lfb.dataset.left),()=>render()); return; }
  const mvb=e.target.closest("[data-move]"); if(mvb){ pickMoveTarget(findSeat(mvb.dataset.move),()=>render()); return; }
  const gs=e.target.closest("[data-goseat]"); if(gs){const s=findSeat(gs.dataset.goseat); floor=s.floor; sel=s.uid; view="map"; render(); return;}
  const bk=e.target.closest("[data-book]"); if(bk){pickSeat(reqOf(bk.dataset.book)); return;}
  const jn=e.target.closest("[data-joined]"); if(jn){const r=reqOf(jn.dataset.joined); markJoined(r); toast(`${r.candidate||r.title} marked as joined`); render(); return;}
  const ro=e.target.closest("[data-req-open]"); if(ro){openReq(ro.dataset.reqOpen); return;}
  const rq=e.target.closest(".req[data-req]"); if(rq){pickSeat(reqOf(rq.dataset.req)); return;}
  if(e.target.closest("[data-rpt]")){ openReportBuilder(); return; }
  const dq=e.target.closest("[data-dq]"); if(dq){lf={q:"",bld:"",floor:"",zone:"",type:"",status:"",dept:"",hrbp:"",dq:dq.dataset.dq,sort:"id",dir:1}; view="list"; render(); return;}
  const sd=e.target.closest("[data-std]"); if(sd){const to=sd.dataset.std, from=JSON.parse(sd.dataset.from); const before=snapshotState(); let n=0; FLOOR_ORDER.forEach(fl=>{let ch=false; seatsOf(fl).forEach(s=>{if(from.includes(s.hrbp)&&s.hrbp!==to){s.hrbp=to;n++;ch=true;}}); if(ch) markFloor(fl);}); log("Standardised HRBP",`${n} seats set to ${to}`); toast(`Updated ${n} seats to “${to}”`,()=>restoreState(before)); render(); return;}
  const bb=e.target.closest("[data-bld]"); if(bb){dashB=bb.dataset.bld; render(); return;}
  const tc=e.target.closest("[data-tcell]"); if(tc){const [t,st]=tc.dataset.tcell.split("|"); lf={q:"",bld:dashB||"",floor:"",zone:"",type:t,status:st,dept:"",hrbp:"",dq:"",sort:"id",dir:1}; view="list"; render(); return;}
  const act=e.target.closest("[data-act]"); if(act){const [k,a,b]=act.dataset.act.split(":"); if(k==="floorgo"){floor=a; mf={q:"",dept:"",status:"",type:""}; view="map";} else if(k==="map"){floor=a; mf={q:"",dept:"",status:"Vacant",type:""}; view="map";} else {lf={q:"",bld:"",floor:"",zone:"",type:"",status:"",dept:k==="dept"?a:"",hrbp:k==="hrbp"?a:"",dq:"",sort:"id",dir:1}; view="list";} render(); return;}
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const m=document.querySelector(".modal"); if(m){m.remove();return;} if($("#layer").innerHTML) closeLayer(); } });
// drag and drop
let drag=null;
document.addEventListener("dragstart",e=>{
  const s=e.target.closest&&e.target.closest("#map .seat"); const r=e.target.closest&&e.target.closest(".req[data-req]");
  if(s){ const seat=findSeat(s.dataset.seat); if(!hasPerson(seat)&&seat.status!=="Reserved"){ e.preventDefault(); return; } drag={kind:"seat",uid:seat.uid}; }
  else if(r){ drag={kind:"req",id:r.dataset.req}; }
  else return;
  try{e.dataTransfer.setData("text/plain","x");e.dataTransfer.effectAllowed="move"}catch(_){}
});
document.addEventListener("dragover",e=>{ if(!drag) return; const t=e.target.closest&&e.target.closest("#map .seat"); document.querySelectorAll(".seat.drop").forEach(x=>x!==t&&x.classList.remove("drop")); if(t){e.preventDefault(); t.classList.add("drop");} });
document.addEventListener("dragend",()=>{drag=null; document.querySelectorAll(".seat.drop").forEach(x=>x.classList.remove("drop"));});
document.addEventListener("drop",e=>{ if(!drag) return; const t=e.target.closest&&e.target.closest("#map .seat"); if(!t) return; e.preventDefault(); const dst=findSeat(t.dataset.seat); const d=drag; drag=null;

    const u=Math.max(7,Math.min(16,Math.floor(1040/C), Math.floor(560/R)));

function loadPptx(){
  if(window.PptxGenJS) return Promise.resolve(window.PptxGenJS);
  const srcs=["https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js","https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"];
  const tryOne=i=>new Promise((res,rej)=>{ if(i>=srcs.length) return rej(new Error("load")); const sc=document.createElement("script"); sc.src=srcs[i]; sc.onload=()=>window.PptxGenJS?res(window.PptxGenJS):tryOne(i+1).then(res,rej); sc.onerror=()=>{ sc.remove(); tryOne(i+1).then(res,rej); }; document.head.appendChild(sc); });
  return tryOne(0);
}

  const rows=allSeats().map(s=>[s.id,FLOOR_SHORT[s.floor],"Zone "+s.zone,s.type,s.desk,s.name,s.empId,s.title,s.dept,s.division,s.hrbp,s.status,s.dateAssigned,s.expStart,s.reqUid?(reqOf(s.reqUid)||{}).title||"":"",s.notes]);
  const csv="﻿"+[head,...rows].map(r=>r.map(csvCell).join(",")).join("\r\n");
  try{ await dl.save({filename:"MV_Seating_Registry_"+today()+".csv",data:csv}); }catch(err){ if(err&&err.code!=="declined") toast("Download is not available here."); }
};

/* ---------- boot ---------- */
let offline=false;
function setupOffline(){
  offline=true; const LS="mvsb:";
  const read=k=>{ try{ const v=localStorage.getItem(LS+k); if(v) return JSON.parse(v); }catch(e){} return window.__SEED?window.__SEED[k]||null:null; };
  db={doc:k=>({onSnapshot(cb){ setTimeout(()=>{const v=read(k); cb({exists:!!v,data:()=>v,metadata:{hasPendingWrites:false}});},0); return ()=>{}; },
    async set(b){ try{ localStorage.setItem(LS+k,JSON.stringify(b)); }catch(e){ throw {code:"quota_exceeded",message:"Browser storage is full"}; } },
    async get(){ const v=read(k); return {exists:!!v,data:()=>v}; }})};
  dl={save:async({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data]); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); return "saved"; }};
  const bar=document.createElement("div"); bar.className="offbar";
  bar.innerHTML=`<span>${window.MV_FORCE_OFFLINE?"<b>Shared snapshot.</b> Data as of "+esc((window.__SEED&&window.__SEED.__asof)||"")+". Any changes you make stay in your own browser only.":"<b>Offline copy.</b> Changes save in this browser on this computer only. Keep a backup, and use the same browser each time."}</span><span class="row">${window.MV_FORCE_OFFLINE?"":`<span class="xlinfo" id="xlInfo"></span><button class="btn small primary" id="xlRefresh">Refresh from Excel</button><button class="btn small" id="xlChange" hidden>Change file</button><button class="btn" id="xlUnlink" hidden>Unlink</button><label class="btn small" for="xlPick" style="cursor:pointer" title="Pick the Excel file once, without linking">Choose Excel file</label><input type="file" id="xlPick" accept=".xlsx,.xlsm" hidden>`}<button class="btn small" id="bkDown">Download full backup</button><label class="btn small" for="bkFile" style="cursor:pointer">Restore a backup</label><input type="file" id="bkFile" accept=".json" hidden></span>`;
  document.querySelector(".wrap").insertBefore(bar,document.querySelector(".wrap").children[1]);
  const KEYS=FLOOR_ORDER.map(f=>"floors/"+f).concat(["plan/main","changes/main","settings/main"]);
  if(bar.querySelector("#xlRefresh")){ bar.querySelector("#xlRefresh").onclick=()=>refreshFromExcel(); bar.querySelector("#xlChange").onclick=()=>linkExcel();
    bar.querySelector("#xlUnlink").onclick=e=>unlinkExcel(e.currentTarget);
    bar.querySelector("#xlPick").onchange=e=>{ const f=e.target.files[0]; if(f) importExcel(f,{linked:true}); e.target.value=""; }; setTimeout(xlStatus,0); }
  bar.querySelector("#bkDown").onclick=()=>{ const out={app:"MV Seating Board",saved:new Date().toISOString()}; KEYS.forEach(k=>out[k]=read(k)); dl.save({filename:"MV_Seating_Backup_"+today()+".json",data:JSON.stringify(out)}); };
  bar.querySelector("#bkFile").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); if(j.app!=="MV Seating Board") throw 0; KEYS.forEach(k=>{ if(j[k]) localStorage.setItem(LS+k,JSON.stringify(j[k])); }); toast("Backup restored. Reloading…"); setTimeout(()=>location.reload(),800); }catch(err){ toast("That file is not an MV Seating Board backup."); } };
}
let shared=false, hosted=false;
/* ---- Microsoft 365 hosting (SharePoint storage, work sign-in) ---- */
async function setupM365(cfg){
  shared=true; hosted=true;
  const showMsg=(t)=>{ $("#main").innerHTML=`<div class="notice">${t}</div>`; };
  if(!window.msal){ showMsg("The Microsoft sign-in library did not load. Check your connection and reload."); throw new Error("no msal"); }
  const pca=new msal.PublicClientApplication({auth:{clientId:cfg.clientId,authority:"https://login.microsoftonline.com/"+cfg.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
  if(pca.initialize) await pca.initialize();
  const red=await pca.handleRedirectPromise().catch(()=>null);
  let account=(red&&red.account)||pca.getAllAccounts()[0];
  const SCOPES=["Sites.ReadWrite.All"];
  if(!account){ showMsg('Signing you in with your work account…'); await pca.loginRedirect({scopes:SCOPES}); return new Promise(()=>{}); }
  pca.setActiveAccount&&pca.setActiveAccount(account);
  whoAmI=account.name||account.username||"";
  const token=async()=>{ try{ return (await pca.acquireTokenSilent({scopes:SCOPES,account})).accessToken; }catch(e){ await pca.acquireTokenRedirect({scopes:SCOPES,account}); return new Promise(()=>{}); } };
  const G="https://graph.microsoft.com/v1.0";
  const gfetch=async(url,opt={})=>{ const t=await token(); const r=await fetch(url.startsWith("http")?url:G+url,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+t},opt.headers||{})})); return r; };
  const u=new URL(cfg.siteUrl);
  let r=await gfetch(`/sites/${u.hostname}:${u.pathname.replace(/\/$/,"")}`);
  if(!r.ok){ showMsg("Could not open the SharePoint site set up for this board ("+esc(cfg.siteUrl)+"). Ask IT to check your access to it."); throw new Error("site "+r.status); }
  const site=await r.json(); const base=`/sites/${site.id}/drive/root:/${encodeURIComponent(cfg.folder).replace(/%2F/g,"/")}`;
  const fname=k=>k.replace("/","-")+".json", keyOf=n=>n.replace(/\.json$/,"").replace("-","/");
  const cache={}, etags={}, subs={};
  const list=async()=>{ const rr=await gfetch(`${base}:/children?$select=name,eTag,@microsoft.graph.downloadUrl&$top=200`); if(rr.status===404) return []; if(!rr.ok) throw {code:"unavailable"}; return (await rr.json()).value.filter(f=>/\.json$/.test(f.name)); };
  const loadFile=async f=>{ const rr=await fetch(f["@microsoft.graph.downloadUrl"]); const txt=await rr.text(); cache[keyOf(f.name)]=JSON.parse(txt); etags[keyOf(f.name)]=f.eTag; };
  try{ const files=await list(); await Promise.all(files.map(loadFile)); }catch(e){ showMsg("Could not read the board's data folder in SharePoint. Ask IT to check your access."); throw e; }
  const deliver=k=>{ const cb=subs[k]; if(!cb) return; const v=cache[k]; cb({exists:!!v,data:()=>v,metadata:{hasPendingWrites:false}}); };
  const refresh=async k=>{ try{ const files=await list(); const f=files.find(x=>keyOf(x.name)===k); if(f) await loadFile(f); deliver(k); }catch(e){} };
  window.__sharedRefresh=refresh;
  const put=async(k,b,force)=>{ const h={"Content-Type":"application/json"}; if(!force){ if(etags[k]) h["If-Match"]=etags[k]; else h["If-None-Match"]="*"; }
    const rr=await gfetch(`${base}/${fname(k)}:/content`,{method:"PUT",headers:h,body:JSON.stringify(b)});
    if(rr.status===412||rr.status===409){ await refresh(k); throw {code:"conflict"}; }
    if(rr.status===401||rr.status===403) throw {code:"invalid_argument"};
    if(!rr.ok) throw {code:"unavailable"};
    const item=await rr.json(); etags[k]=item.eTag; cache[k]=b; };
  db={doc:k=>({ onSnapshot(cb){ subs[k]=cb; setTimeout(()=>deliver(k),0); return ()=>{ delete subs[k]; }; }, async get(){ const v=cache[k]; return {exists:!!v,data:()=>v}; }, async set(b){ await put(k,b,false); } })};
  dl={save:async({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data]); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); return "saved"; }};
  setInterval(async()=>{ if(document.hidden) return; try{ const files=await list(); for(const f of files){ const k=keyOf(f.name); if(f.eTag!==etags[k]&&!dirty.has(k)){ await loadFile(f); deliver(k); } } }catch(e){} },15000);
  const KEYS=FLOOR_ORDER.map(f=>"floors/"+f).concat(["plan/main","changes/main","settings/main"]);
  const bar=document.createElement("div"); bar.className="offbar"; bar.style.background="color-mix(in srgb,var(--occ) 12%,var(--surface))"; bar.style.borderColor="color-mix(in srgb,var(--occ) 40%,transparent)";
  bar.innerHTML=`<span><b>Shared board.</b> Signed in as ${esc(whoAmI)}. Changes save to SharePoint for everyone, and others' updates appear within about 15 seconds.</span><span class="row"><button class="btn small" id="bkDown">Download full backup</button><label class="btn small" for="bkFile" style="cursor:pointer">Restore a backup</label><input type="file" id="bkFile" accept=".json" hidden></span>`;
  document.querySelector(".wrap").insertBefore(bar,document.querySelector(".wrap").children[1]);
  bar.querySelector("#bkDown").onclick=()=>{ const out={app:"MV Seating Board",saved:new Date().toISOString()}; KEYS.forEach(k=>out[k]=cache[k]||null); dl.save({filename:"MV_Seating_Backup_"+today()+".json",data:JSON.stringify(out)}); };
  bar.querySelector("#bkFile").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; let j; try{ j=JSON.parse(await f.text()); if(j.app!=="MV Seating Board") throw 0; }catch(err){ toast("That file is not an MV Seating Board backup."); return; }
    const hasData=KEYS.some(k=>cache[k]); const btn=bar.querySelector("label[for=bkFile]");
    if(hasData&&!btn.dataset.sure){ btn.dataset.sure="1"; btn.textContent="Choose the file again to replace ALL shared data"; e.target.value=""; return; }
    toast("Restoring backup…"); try{ for(const k of KEYS){ if(j[k]) await put(k,j[k],true); } toast("Backup restored. Reloading…"); setTimeout(()=>location.reload(),900); }catch(err){ toast("Restore failed. Check your access and try again."); } };
}
function gasRun(fn,...args){ return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>{ const m=String(e&&e.message||e); rej({code:/BAD_PASSCODE/.test(m)?"bad_pass":"unavailable",message:m}); })[fn](...args)); }
function askAccess(prevErr){
  return new Promise(resolve=>{
    let code="", name=""; try{ code=localStorage.getItem("mvsb-pass")||""; name=localStorage.getItem("mvsb-name")||""; }catch(e){}
    const m=document.createElement("div"); m.className="modal";
    m.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="Sign in" style="width:min(420px,100%)"><h3 style="font-size:19px">MV Seating Board</h3>
      <div class="cap" style="margin:0">Enter the team passcode and your name. Your name is shown next to your changes in the activity log.</div>
      ${prevErr?`<div class="hint" style="color:var(--bad)">${esc(prevErr)}</div>`:""}
      <label class="field">Your name<input type="text" id="acN" value="${esc(name)}" autocomplete="name"></label>
      <label class="field">Team passcode<input type="password" id="acP" value="${esc(prevErr?"":code)}"></label>
      <div class="row"><span class="spacer"></span><button class="btn primary" id="acOk">Open board</button></div></div>`;
    document.body.appendChild(m);
    const go=()=>{ const n=m.querySelector("#acN").value.trim(), c=m.querySelector("#acP").value; if(!n){ m.querySelector("#acN").focus(); return; } try{ localStorage.setItem("mvsb-name",n); localStorage.setItem("mvsb-pass",c); }catch(e){} m.remove(); resolve({code:c,name:n}); };
    m.querySelector("#acOk").onclick=go; m.querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter") go();}));
    setTimeout(()=>(m.querySelector(name?"#acP":"#acN")).focus(),30);
  });
}
async function setupShared(){
  shared=true;
  let acc=null, all=null, err="";
  while(!all){ acc=await askAccess(err); try{ all=await gasRun("getAll",acc.code); }catch(e){ err=e.code==="bad_pass"?"That passcode is not correct.":"Could not reach the board. Check your connection and try again."; } }
  whoAmI=acc.name;
  const cache={}, vers={}, subs={};
  Object.entries(all).forEach(([k,o])=>{ cache[k]=JSON.parse(o.data); vers[k]=o.v; });
  const deliver=k=>{ const cb=subs[k]; if(!cb) return; const v=cache[k]; cb({exists:!!v,data:()=>v,metadata:{hasPendingWrites:false}}); };
  const refresh=async k=>{ try{ const o=await gasRun("getDoc",acc.code,k); if(o){ cache[k]=JSON.parse(o.data); vers[k]=o.v; } deliver(k); }catch(e){} };
  window.__sharedRefresh=refresh;
  db={doc:k=>({
    onSnapshot(cb){ subs[k]=cb; setTimeout(()=>deliver(k),0); return ()=>{ delete subs[k]; }; },
    async get(){ const v=cache[k]; return {exists:!!v,data:()=>v}; },
    async set(b){ const json=JSON.stringify(b); const r=await gasRun("setDoc",acc.code,k,json,vers[k]==null?-1:vers[k],whoAmI);
      if(r&&r.conflict){ vers[k]=r.v; cache[k]=JSON.parse(r.data); throw {code:"conflict"}; }
      vers[k]=r.v; cache[k]=b; }
  })};
  dl={save:async({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data]); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); return "saved"; }};
  setInterval(async()=>{ if(document.hidden) return; try{ const v=await gasRun("getVersions",acc.code); Object.entries(v).forEach(([k,ver])=>{ if(ver!==vers[k]&&!dirty.has(k)) refresh(k); }); }catch(e){} },12000);
  const KEYS=FLOOR_ORDER.map(f=>"floors/"+f).concat(["plan/main","changes/main","settings/main"]);
  const bar=document.createElement("div"); bar.className="offbar"; bar.style.background="color-mix(in srgb,var(--occ) 12%,var(--surface))"; bar.style.borderColor="color-mix(in srgb,var(--occ) 40%,transparent)";
  bar.innerHTML=`<span><b>Shared board.</b> Signed in as ${esc(whoAmI)}. Changes save for everyone and others' updates appear within a few seconds.</span><span class="row"><button class="btn small" id="shSwitch">Change name</button><button class="btn small" id="bkDown">Download full backup</button><label class="btn small" for="bkFile" style="cursor:pointer">Restore a backup</label><input type="file" id="bkFile" accept=".json" hidden></span>`;
  document.querySelector(".wrap").insertBefore(bar,document.querySelector(".wrap").children[1]);
  bar.querySelector("#shSwitch").onclick=()=>{ try{ localStorage.removeItem("mvsb-name"); }catch(e){} location.reload(); };
  bar.querySelector("#bkDown").onclick=()=>{ const out={app:"MV Seating Board",saved:new Date().toISOString()}; KEYS.forEach(k=>out[k]=cache[k]||null); dl.save({filename:"MV_Seating_Backup_"+today()+".json",data:JSON.stringify(out)}); };
  bar.querySelector("#bkFile").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; let j; try{ j=JSON.parse(await f.text()); if(j.app!=="MV Seating Board") throw 0; }catch(err){ toast("That file is not an MV Seating Board backup."); return; }
    const hasData=KEYS.some(k=>cache[k]); const btn=bar.querySelector("label[for=bkFile]");
    if(hasData&&!btn.dataset.sure){ btn.dataset.sure="1"; btn.textContent="Choose the file again to replace ALL shared data"; e.target.value=""; return; }
    toast("Restoring backup…"); try{ for(const k of KEYS){ if(j[k]) await gasRun("setDoc",acc.code,k,JSON.stringify(j[k]),-2,whoAmI); } toast("Backup restored. Reloading…"); setTimeout(()=>location.reload(),900); }catch(err){ toast("Restore failed. Try again."); } };
}
async function boot(){
  let got=null;
  if(window.MV_M365&&/PASTE/.test(window.MV_M365.clientId+window.MV_M365.tenantId+window.MV_M365.siteUrl)){ loaded=true; $("#main").innerHTML='<div class="notice">This board is not connected to SharePoint yet. Setup is still in progress, so please check back soon.</div>'; return; }
  if(window.MV_M365&&window.MV_M365.clientId){ try{ await setupM365(window.MV_M365); }catch(e){ loaded=true; return; } }
  else if(window.google&&google.script&&google.script.run) await setupShared();
  else if(window.MV_FORCE_OFFLINE||!(window.claude&&window.claude.use)){ setupOffline(); if(window.claude&&window.claude.use){ try{ const d=await window.claude.use("downloads"); if(d) dl=d; }catch(e){} } }
  else { try{ got=await window.claude.use("db"); }catch(e){} db=got; try{ dl=await window.claude.use("downloads"); }catch(e){ dl=null; } }
  if(dl) $("#csvBtn").hidden=false;
  if(!db){ loaded=true; $("#main").innerHTML='<div class="notice">Your seating data is kept in this board\'s saved storage, which is not available in this view. Open the board from your Claude artifacts to see it.</div>'; return; }
  const keys=FLOOR_ORDER.map(f=>"floors/"+f).concat(["plan/main","changes/main","settings/main"]);
  const got1={};
  const apply=(k,snap)=>{
    if(!snap.exists){ got1[k]=true; return; }
    if(dirty.has(k)||snap.metadata.hasPendingWrites) { got1[k]=true; return; }
    const body=snap.data(); const js=JSON.stringify(body); if(lastJSON[k]===js){ got1[k]=true; return; } lastJSON[k]=js;
    const copy=JSON.parse(js);
    if(k.startsWith("floors/")){ copy.seats.forEach(s=>{ if(!s.uid) s.uid=s.id; if(!s.status) s.status="Unspecified"; }); floors[k.slice(7)]=copy; }
    else if(k==="plan/main") plan={reqs:copy.reqs||[]};
    else if(k==="settings/main"){ settings={deptColors:copy.deptColors||{},statuses:copy.statuses||[]}; if(Array.isArray(copy.hrbps)) settings.hrbps=copy.hrbps; }
    else changes={requests:copy.requests||[],log:copy.log||[]};
    got1[k]=true;
  };
  const maybeRender=()=>{
    if(!loaded&&keys.every(k=>got1[k])){ loaded=true; noData=!FLOOR_ORDER.some(f=>floors[f]); if(!floors[floor]) floor=FLOOR_ORDER.find(f=>floors[f])||"F1"; if(!noData) assignMissingColors(); render(); }
    else if(loaded){ const typing=document.activeElement&&document.activeElement.matches("input,textarea,select"); if(!$("#layer").innerHTML&&!typing&&!document.querySelector(".modal")) render(); else { renderKpis(); renderTabs(); } }
  };
  keys.forEach(k=>db.doc(k).onSnapshot(s=>{apply(k,s); maybeRender();},()=>{got1[k]=true; setSave("Offline"); maybeRender();}));
}
boot();
})();
